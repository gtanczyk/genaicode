name: Import verified macOS screenshots
on:
  push:
    branches: [codex/render-macos-371]
    paths: ['.github/workflows/render-macos-371.yaml']
permissions: {}
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-task-viewer
          run-id: 45711400335
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-darwin
      - name: Commit the four verified files to the rendering branch
        run: |
          set -euo pipefail
          for name in page-{task,viewer}-{light,dark}.png; do
            file="$RUNNER_TEMP/verified-darwin/$name"
            test -f "$file" && test ! -L "$file"
            file --brief "$file" | grep -q '^PNG image data, 1280 x 800,'
            cp "$file" "src/ui/__screenshots__/darwin/$name"
            git add -- "src/ui/__screenshots__/darwin/$name"
          done
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh the four macOS task and viewer baselines'
          git push origin HEAD:refs/heads/codex/render-macos-371
