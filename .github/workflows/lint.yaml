name: Lint and test

on: [push, pull_request]

defaults:
  run:
    working-directory: ./

jobs:
  build_and_test:
    # Playwright 1.56 cannot install Chromium deps on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      models: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A change to src/ must add a docs/CHANGELOG.md line (see AGENTS.md, Changelog and releases).
      - name: Changelog guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # A separate assignment, so a failed file lookup fails the step instead of passing an empty list.
            files="$(gh pr diff "${{ github.event.pull_request.number }}" --name-only)"
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            node scripts/release.mjs check --base "${{ github.event.pull_request.base.sha }}" --files "$files"
          else
            node scripts/release.mjs check
          fi
      - name: Install the Linux pack test sandbox
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo systemctl start "user@$(id -u).service"
      - run: npm run check
        env:
          GENAICODE_TEST_REQUIRE_BWRAP: '1'
      # apt behind `--with-deps` can stall on a slow runner mirror. apt itself retries and times out
      # each download, waits for a lock a killed try left, and each try gets 5 minutes.
      - name: Install Chromium for the browser tests
        timeout-minutes: 16
        run: |
          printf '%s\n' 'Acquire::Retries "5";' 'Acquire::http::Timeout "20";' 'DPkg::Lock::Timeout "120";' \
            | sudo tee /etc/apt/apt.conf.d/99genaicode-ci > /dev/null
          for attempt in 1 2 3; do
            timeout -k 10 300 npx playwright install --with-deps chromium && exit 0
            echo "Playwright install attempt $attempt failed or hung; retrying."
            # A timed-out try leaves its apt-get running as root, holding the dpkg lock.
            sudo pkill -x apt-get || true
            sleep 5
            sudo dpkg --configure -a || true
          done
          exit 1
      - run: npm run test:browser
      # What the visual baseline test drew (src/ui/visual.browser.test.ts), to look at a mismatch
      # or to take new Linux baselines from.
      - name: Keep the screenshots of the visual baseline test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: node_modules/.genaicode-test/visual-screenshots
          include-hidden-files: true
          if-no-files-found: ignore
