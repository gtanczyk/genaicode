name: Lint and test

on: [push, pull_request]

defaults:
  run:
    working-directory: ./

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
