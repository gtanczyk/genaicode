name: Lint and test

on: [push, pull_request]

defaults:
  run:
    working-directory: ./

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A change to src/ must add a CHANGELOG.md line (see AGENTS.md, Changelog and releases).
      - name: Changelog guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            node scripts/release.mjs check --base "${{ github.event.pull_request.base.sha }}" \
              --files "$(gh pr diff "${{ github.event.pull_request.number }}" --name-only | paste -sd, -)"
          else
            node scripts/release.mjs check
          fi
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
