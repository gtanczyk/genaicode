name: Provider E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: ./

jobs:
  openai:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: ${{ env.OPENAI_API_KEY != '' && env.OPENAI_MODEL != '' }}
        run: npm run test:e2e
      - if: ${{ env.OPENAI_API_KEY == '' || env.OPENAI_MODEL == '' }}
        run: echo "Skipping OpenAI E2E: required secrets are missing."

  anthropic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: ${{ env.ANTHROPIC_API_KEY != '' && env.ANTHROPIC_MODEL != '' }}
        run: npm run test:e2e
      - if: ${{ env.ANTHROPIC_API_KEY == '' || env.ANTHROPIC_MODEL == '' }}
        run: echo "Skipping Anthropic E2E: required secrets are missing."

  gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - if: ${{ env.GEMINI_API_KEY != '' && env.GEMINI_MODEL != '' }}
        run: npm run test:e2e
      - if: ${{ env.GEMINI_API_KEY == '' || env.GEMINI_MODEL == '' }}
        run: echo "Skipping Gemini E2E: required secrets are missing."
