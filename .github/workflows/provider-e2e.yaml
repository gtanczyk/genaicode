name: Provider E2E

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: ./

jobs:
  openai:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          if [ -z "${OPENAI_API_KEY:-}" ] || [ -z "${OPENAI_MODEL:-}" ]; then
            echo "Skipping OpenAI E2E: required secrets are missing."
            exit 0
          fi
          npm run test:e2e

  anthropic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ] || [ -z "${ANTHROPIC_MODEL:-}" ]; then
            echo "Skipping Anthropic E2E: required secrets are missing."
            exit 0
          fi
          npm run test:e2e

  gemini:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: |
          if [ -z "${GEMINI_API_KEY:-}" ] || [ -z "${GEMINI_MODEL:-}" ]; then
            echo "Skipping Gemini E2E: required secrets are missing."
            exit 0
          fi
          npm run test:e2e
