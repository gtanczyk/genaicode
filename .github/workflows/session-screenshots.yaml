name: Capture session screenshots on macOS
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/session-screenshots.yaml']
permissions:
  contents: read
jobs:
  capture:
    if: github.head_ref == 'sessions-open-transcript'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: GENAICODE_UPDATE_SCREENSHOTS=1 npm run test:browser -- visual -t 'the session list and open transcript'
      - uses: actions/upload-artifact@v4
        with:
          name: session-screenshots-darwin
          path: |
            src/ui/__screenshots__/darwin/all-sessions-*.png
            src/ui/__screenshots__/darwin/session-transcript-*.png
          if-no-files-found: error
