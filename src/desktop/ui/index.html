<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Genaicode</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <!-- On macOS the window has no title bar of its own: this strip moves it. -->
    <div data-tauri-drag-region style="position: fixed; inset: 0 0 auto 0; height: 52px"></div>
    <main>
      <h1>Genaicode</h1>
      <p>Starting…</p>
    </main>
  </body>
</html>
