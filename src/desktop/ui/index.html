<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>genaicode</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      main {
        text-align: center;
        max-width: 28rem;
        padding: 2rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.25rem;
        opacity: 0.7;
      }
      button {
        font: inherit;
        padding: 0.5rem 1.25rem;
        border-radius: 8px;
        border: 0;
        background: #3b5bdb;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>genaicode</h1>
      <p>Choose a project folder to start a chat with your coding agent there.</p>
      <button id="open" type="button">Open Folder…</button>
    </main>
    <script>
      document.getElementById('open').addEventListener('click', () => {
        window.__TAURI_INTERNALS__.invoke('open_folder');
      });
    </script>
  </body>
</html>
