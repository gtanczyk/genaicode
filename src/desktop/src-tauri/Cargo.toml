[package]
name = "genaicode-desktop"
version = "0.1.0"
description = "The genaicode desktop app: a native shell around `genaicode ui`"
authors = ["Grzegorz Tańczyk"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "genaicode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# The launcher crate tauri-plugin-opener uses, called blocking: it waits for each launcher to exit.
open = "5"
