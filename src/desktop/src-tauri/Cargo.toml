[package]
name = "genaicode-desktop"
version = "0.1.0"
description = "The genaicode desktop app: a native shell around `genaicode ui`"
authors = ["Grzegorz Tańczyk"]
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "genaicode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
